<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>融资申请</title>
<style>body{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;margin:40px;background:#f7f7f4;color:#15201c}main{max-width:1040px;margin:auto}.bar,.filters{display:flex;gap:12px;align-items:center;margin-bottom:20px}.bar{justify-content:space-between}.filters input,.filters select,.filters button{padding:10px 12px}table{width:100%;border-collapse:collapse;background:white}th,td{padding:14px;border-bottom:1px solid #e5e7eb;text-align:left}.muted{color:#69736e}.pill{padding:4px 10px;border-radius:999px;background:#eef3f0}.pager{margin-top:18px}</style></head>
<body><main><div class="bar"><div><h1>融资申请</h1><div class="muted">筛选与导出</div></div></div>
<div class="filters"><input id="customer_name" placeholder="客户名称"><select id="status"><option value="">全部状态</option><option>SUBMITTED</option><option>APPROVED</option><option>FUNDED</option><option>REJECTED</option></select><button id="search">查询</button><button id="export">导出</button><span id="msg" class="muted"></span></div>
<table><thead><tr><th>申请编号</th><th>客户</th><th>状态</th><th>金额</th></tr></thead><tbody id="rows"></tbody></table><div class="pager"><button id="prev">上一页</button> <span id="page"></span> <button id="next">下一页</button></div></main>
<script>let page=1;function qs(){const p=new URLSearchParams({page:String(page),page_size:'5'});const c=document.querySelector('#customer_name').value.trim();const s=document.querySelector('#status').value;if(c)p.set('customer_name',c);if(s)p.set('status',s);return p}async function load(){const r=await fetch('/api/financing-applications?'+qs(),{headers:{'X-User':'alice'}});const d=await r.json();document.querySelector('#rows').innerHTML=d.items.map(x=>`<tr><td>${x.id}</td><td>${x.customer_name}</td><td><span class="pill">${x.status}</span></td><td>${x.amount.toLocaleString()}</td></tr>`).join('');document.querySelector('#page').textContent=`第 ${d.page} 页 / 共 ${d.total} 条`;document.querySelector('#prev').disabled=page<=1;document.querySelector('#next').disabled=page*d.page_size>=d.total}document.querySelector('#search').addEventListener('click',()=>{page=1;load()});document.querySelector('#export').addEventListener('click',async()=>{const p=qs();p.delete('page');p.delete('page_size');const r=await fetch('/api/financing-applications/export?'+p,{method:'POST',headers:{'X-User':'alice'}});const d=await r.json();document.querySelector('#msg').textContent='导出任务已提交：'+d.id.slice(0,8)});document.querySelector('#prev').addEventListener('click',()=>{page=Math.max(1,page-1);load()});document.querySelector('#next').addEventListener('click',()=>{page+=1;load()});load();</script></body></html>
