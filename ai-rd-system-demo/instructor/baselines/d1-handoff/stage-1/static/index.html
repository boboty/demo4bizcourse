<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>融资申请</title>
  <style>
    body{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;margin:40px;background:#f7f7f4;color:#15201c}
    main{max-width:1040px;margin:auto}.bar{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:20px}
    h1{margin:0 0 6px}.muted{color:#69736e}.stage{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.stage span{padding:5px 10px;border-radius:999px;font-size:13px;font-weight:700}.done{background:#dff4e8;color:#17643f}.todo{background:#f2eee4;color:#7b6b45}
    .filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:white;border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin-bottom:16px}.filters input{padding:9px 11px;border:1px solid #cfd6d2;border-radius:8px;min-width:240px}.filters button,.pager button{padding:9px 13px;border:1px solid #cfd6d2;border-radius:8px;background:white;cursor:pointer}.filters button.primary{background:#17362d;color:white;border-color:#17362d}
    table{width:100%;border-collapse:collapse;background:white;border-radius:12px;overflow:hidden}th,td{padding:14px;border-bottom:1px solid #e5e7eb;text-align:left}.pill{padding:4px 10px;border-radius:999px;background:#eef3f0}.pager{margin-top:18px}
  </style>
</head>
<body>
<main>
  <div class="bar"><div><h1>融资申请</h1><div class="muted">上一 Session 已完成客户名称筛选；状态筛选和导出等待下一棒接手。</div><div class="stage"><span class="done">✓ 客户名称筛选</span><span class="todo">○ 状态筛选</span><span class="todo">○ 导出</span></div></div></div>
  <div class="filters">
    <input id="customerName" placeholder="客户名称（模糊匹配）" />
    <button id="apply" class="primary">筛选</button>
    <button id="clear">清空</button>
  </div>
  <table><thead><tr><th>申请编号</th><th>客户</th><th>状态</th><th>金额</th></tr></thead><tbody id="rows"></tbody></table>
  <div class="pager"><button id="prev">上一页</button> <span id="page"></span> <button id="next">下一页</button></div>
</main>
<script>
let page=1;
function query(){
  const p=new URLSearchParams({page:String(page),page_size:'5'});
  const customerName=document.querySelector('#customerName').value.trim();
  if(customerName)p.set('customer_name',customerName);
  return p.toString();
}
async function load(){
  const r=await fetch(`/api/financing-applications?${query()}`,{headers:{'X-User':'alice'}});
  const d=await r.json();
  document.querySelector('#rows').innerHTML=d.items.map(x=>`<tr><td>${x.id}</td><td>${x.customer_name}</td><td><span class="pill">${x.status}</span></td><td>${x.amount.toLocaleString()}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">没有匹配结果</td></tr>';
  document.querySelector('#page').textContent=`第 ${d.page} 页 / 共 ${d.total} 条`;
  document.querySelector('#prev').disabled=page<=1;
  document.querySelector('#next').disabled=page*d.page_size>=d.total;
}
document.querySelector('#apply').addEventListener('click',()=>{page=1;load()});
document.querySelector('#clear').addEventListener('click',()=>{document.querySelector('#customerName').value='';page=1;load()});
document.querySelector('#customerName').addEventListener('keydown',e=>{if(e.key==='Enter'){page=1;load()}});
document.querySelector('#prev').addEventListener('click',()=>{page=Math.max(1,page-1);load()});
document.querySelector('#next').addEventListener('click',()=>{page+=1;load()});
load();
</script>
</body>
</html>
