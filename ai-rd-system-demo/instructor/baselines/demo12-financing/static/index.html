<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>融资申请</title>
  <style>
    body{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;margin:40px;background:#f7f7f4;color:#15201c}
    main{max-width:1040px;margin:auto}.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
    table{width:100%;border-collapse:collapse;background:white}th,td{padding:14px;border-bottom:1px solid #e5e7eb;text-align:left}
    .muted{color:#69736e}.pill{display:inline-block;padding:4px 10px;border-radius:999px;background:#eef3f0;color:#3f4a45;border:1px solid #dfe5e1;white-space:nowrap}.pager{margin-top:18px}
    .pill.status-pending{background:#fdf4e3;border-color:#f0dcae;color:#8a5a12}
    .pill.status-approved{background:#e9f5ef;border-color:#bfe0cd;color:#146b45}
    .pill.status-funded{background:#e9f1fb;border-color:#c3daf5;color:#1c5aa3}
    .pill.status-rejected{background:#fdecea;border-color:#f3c9c4;color:#a3372b}
  </style>
</head>
<body>
<main>
  <div class="bar"><div><h1>融资申请</h1><div class="muted">当前版本：只有列表和分页</div></div></div>
  <table><thead><tr><th>申请编号</th><th>客户</th><th>状态</th><th>金额</th></tr></thead><tbody id="rows"></tbody></table>
  <div class="pager"><button id="prev">上一页</button> <span id="page"></span> <button id="next">下一页</button></div>
</main>
<script>
const STATUS_LABELS = { SUBMITTED: '待审核', APPROVED: '已通过', REJECTED: '未通过', FUNDED: '已放款' };
const STATUS_CLASSES = { SUBMITTED: 'status-pending', APPROVED: 'status-approved', REJECTED: 'status-rejected', FUNDED: 'status-funded' };
function statusLabel(value) { return value ? (STATUS_LABELS[value] || value) : '(空)'; }
function statusClass(value) { return STATUS_CLASSES[value] || ''; }
function statusPill(value) { return `<span class="pill ${statusClass(value)}">${statusLabel(value)}</span>`; }
let page=1;
async function load(){
  const r=await fetch(`/api/financing-applications?page=${page}&page_size=5`,{headers:{'X-User':'alice'}});
  const d=await r.json();
  document.querySelector('#rows').innerHTML=d.items.map(x=>`<tr><td>${x.id}</td><td>${x.customer_name}</td><td>${statusPill(x.status)}</td><td>${x.amount.toLocaleString()}</td></tr>`).join('');
  document.querySelector('#page').textContent=`第 ${d.page} 页 / 共 ${d.total} 条`;
  document.querySelector('#prev').disabled=page<=1;
  document.querySelector('#next').disabled=page*d.page_size>=d.total;
}
document.querySelector('#prev').addEventListener('click',()=>{page=Math.max(1,page-1);load()});
document.querySelector('#next').addEventListener('click',()=>{page+=1;load()});
load();
</script>
</body>
</html>
