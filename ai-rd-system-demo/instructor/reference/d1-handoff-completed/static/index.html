<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>融资申请</title>
  <style>
    body{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;margin:40px;background:#f7f7f4;color:#15201c}
    main{max-width:1040px;margin:auto}.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:12px}
    table{width:100%;border-collapse:collapse;background:white}th,td{padding:14px;border-bottom:1px solid #e5e7eb;text-align:left}
    .muted{color:#69736e}.pill{display:inline-block;padding:4px 10px;border-radius:999px;background:#eef3f0;color:#3f4a45;border:1px solid #dfe5e1;white-space:nowrap}.pager{margin-top:18px}
    .pill.status-pending{background:#fdf4e3;border-color:#f0dcae;color:#8a5a12}
    .pill.status-approved{background:#e9f5ef;border-color:#bfe0cd;color:#146b45}
    .pill.status-funded{background:#e9f1fb;border-color:#c3daf5;color:#1c5aa3}
    .pill.status-rejected{background:#fdecea;border-color:#f3c9c4;color:#a3372b}
    .pill.status-queued{background:#eeecf7;border-color:#d3cfe9;color:#4f4a80}
    .progress{display:flex;gap:10px;font-size:14px;flex-wrap:wrap}
    .progress span{color:#0c7a54;font-weight:700}
    .filters{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
    .filters input,.filters select{padding:8px 10px;border:1px solid #d8d0bf;border-radius:8px}
    .filters input{min-width:220px}
    .filters button{padding:8px 14px;border:1px solid #d8d0bf;border-radius:8px;background:white;cursor:pointer}
    .filters button.primary{background:#0c7a54;border-color:#0c7a54;color:white}
    #export-result{margin-bottom:16px;padding:10px 14px;border-radius:8px;background:#eef5ef;border:1px solid #c9ddd0;font-size:14px;display:none}
  </style>
</head>
<body>
<main>
  <div class="bar">
    <div>
      <h1>融资申请</h1>
      <div class="progress" id="feature-status">
        <span>客户名称筛选 ✓</span>
        <span>融资状态筛选 ✓</span>
        <span>导出 ✓</span>
      </div>
    </div>
  </div>
  <div class="filters">
    <input id="customer-name-input" type="text" placeholder="按客户名称筛选（支持模糊匹配）" />
    <select id="status-select">
      <option value="">全部状态</option>
      <option value="SUBMITTED">待审核</option>
      <option value="APPROVED">已通过</option>
      <option value="FUNDED">已放款</option>
      <option value="REJECTED">未通过</option>
    </select>
    <button id="apply-filter-btn">筛选</button>
    <button id="clear-filter-btn">清除</button>
    <button id="export-btn" class="primary">导出当前筛选结果</button>
  </div>
  <div id="export-result"></div>
  <table><thead><tr><th>申请编号</th><th>客户</th><th>状态</th><th>金额</th></tr></thead><tbody id="rows"></tbody></table>
  <div class="pager"><button id="prev">上一页</button> <span id="page"></span> <button id="next">下一页</button></div>
</main>
<script>
const STATUS_LABELS = { SUBMITTED: '待审核', APPROVED: '已通过', REJECTED: '未通过', FUNDED: '已放款' };
const STATUS_CLASSES = { SUBMITTED: 'status-pending', APPROVED: 'status-approved', REJECTED: 'status-rejected', FUNDED: 'status-funded' };
const JOB_STATUS_LABELS = { QUEUED: '已提交' };
const JOB_STATUS_CLASSES = { QUEUED: 'status-queued' };
function statusLabel(value) { return value ? (STATUS_LABELS[value] || value) : '(空)'; }
function jobStatusLabel(value) { return JOB_STATUS_LABELS[value] || value; }
function statusClass(value) { return STATUS_CLASSES[value] || ''; }
function jobStatusClass(value) { return JOB_STATUS_CLASSES[value] || ''; }
function statusPill(value) { return `<span class="pill ${statusClass(value)}">${statusLabel(value)}</span>`; }
function jobStatusPill(value) { return `<span class="pill ${jobStatusClass(value)}">${jobStatusLabel(value)}</span>`; }

let page = 1;
let customerName = '';
let status = '';

function buildQuery() {
  const params = new URLSearchParams({ page, page_size: 5 });
  if (customerName) params.set('customer_name', customerName);
  if (status) params.set('status', status);
  return params.toString();
}

async function load() {
  const r = await fetch(`/api/financing-applications?${buildQuery()}`, { headers: { 'X-User': 'alice' } });
  const d = await r.json();
  document.querySelector('#rows').innerHTML = d.items.map(x => `<tr><td>${x.id}</td><td>${x.customer_name}</td><td>${statusPill(x.status)}</td><td>${x.amount.toLocaleString()}</td></tr>`).join('');
  document.querySelector('#page').textContent = `第 ${d.page} 页 / 共 ${d.total} 条`;
  document.querySelector('#prev').disabled = page <= 1;
  document.querySelector('#next').disabled = page * d.page_size >= d.total;
}

function applyFilters() {
  customerName = document.querySelector('#customer-name-input').value.trim();
  status = document.querySelector('#status-select').value;
  page = 1;
  document.querySelector('#export-result').style.display = 'none';
  load();
}

document.querySelector('#prev').addEventListener('click', () => { page = Math.max(1, page - 1); load(); });
document.querySelector('#next').addEventListener('click', () => { page += 1; load(); });
document.querySelector('#apply-filter-btn').addEventListener('click', applyFilters);
document.querySelector('#clear-filter-btn').addEventListener('click', () => {
  document.querySelector('#customer-name-input').value = '';
  document.querySelector('#status-select').value = '';
  applyFilters();
});
document.querySelector('#customer-name-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') applyFilters();
});

document.querySelector('#export-btn').addEventListener('click', async () => {
  const params = new URLSearchParams();
  if (customerName) params.set('customer_name', customerName);
  if (status) params.set('status', status);
  const r = await fetch(`/api/financing-applications/export?${params.toString()}`, {
    method: 'POST',
    headers: { 'X-User': 'alice' },
  });
  const job = await r.json();
  const box = document.querySelector('#export-result');
  box.style.display = 'block';
  box.innerHTML = `导出任务已创建：任务编号 <b>${job.id}</b> · 任务状态 ${jobStatusPill(job.status)} · 筛选条件：客户名称=<b>${job.payload.filters.customer_name || '(空)'}</b>，融资状态=${statusPill(job.payload.filters.status)} · 共 <b>${job.payload.rows.length}</b> 条记录`;
});

load();
</script>
</body>
</html>
