openapi: 3.1.0
info:
  title: AgentAI Test Demo - Order Calculate
  version: 1.0.0
paths:
  /api/orders/calculate:
    post:
      summary: Calculate order discount and final amount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCalculateRequest'
      responses:
        '200':
          description: Discount and final amount for the order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCalculateResponse'
components:
  schemas:
    OrderCalculateRequest:
      type: object
      required: [memberLevel, amount]
      properties:
        memberLevel: {type: string, enum: [GOLD, SILVER, STANDARD]}
        amount: {type: integer, minimum: 0}
    OrderCalculateResponse:
      type: object
      required: [status, discount, finalAmount]
      properties:
        status: {type: string, enum: [SUCCESS]}
        discount: {type: integer}
        finalAmount: {type: integer}
