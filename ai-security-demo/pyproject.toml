[project]
name = "ai-security-demo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
[dependency-groups]
dev = ["pytest>=8,<9", "httpx>=0.28,<1", "ruff>=0.11,<1", "pyright>=1.1.400,<2"]
[tool.ruff]
line-length = 110
[tool.pyright]
pythonVersion = "3.12"
include = ["app"]
[tool.pytest.ini_options]
pythonpath = ["."]
